<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostIt - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="logged-in">
    <nav>
      <a href="index.html">Home</a>
      <a href="addPost.html">Add Post</a>
    </nav>
    <div class="account">
      <a href="login.html" class="login-link">
        <span class="login-text">Login</span>
        <img class="avatar" src="avatar.svg" alt="Your profile">
      </a>
      <a href="#logout" class="logout-link">Logout</a>
    </div>
  </header>

  <main>
    <aside></aside>
    <section class="feed">
      <article>
        <div class="post-info"><span class="avatar"></span><time datetime="2022-10-22">Oct 22, 2022</time></div>
        <img src="tartu.svg" alt="Tartu town hall square">
        <p>Tartu 2022</p>
        <button class="like" type="button">Like</button>
      </article>

      <article>
        <div class="post-info"><span class="avatar"></span><time datetime="2022-10-02">Oct 2, 2022</time></div>
        <p>Anyone knows in which room is the lab today?</p>
        <button class="like" type="button">Like</button>
      </article>

      <article>
        <div class="post-info"><span class="avatar"></span><time datetime="2022-09-28">Sep 28, 2022</time></div>
        <img src="tartu.svg" alt="Tartu street">
        <p>Walking home after the lecture.</p>
        <button class="like" type="button">Like</button>
      </article>

      <article>
        <div class="post-info"><span class="avatar"></span><time datetime="2022-09-20">Sep 20, 2022</time></div>
        <p>Does anyone have notes from the last HTML lecture?</p>
        <button class="like" type="button">Like</button>
      </article>

      <article>
        <div class="post-info"><span class="avatar"></span><time datetime="2022-09-15">Sep 15, 2022</time></div>
        <p>Found a great cafe near the university.</p>
        <button class="like" type="button">Like</button>
      </article>
    </section>
    <aside></aside>
  </main>

  <footer>PostIt</footer>
</body>
</html>
