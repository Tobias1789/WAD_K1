<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostIt - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="logged-in">
    <nav>
      <a href="index.html">Home</a>
      <a href="addPost.html">Add Post</a>
    </nav>
    <div class="account">
      <a href="login.html" class="login-link">
        <span class="login-text">Login</span>
        <img class="avatar" src="avatar.svg" alt="Your profile">
      </a>
      <a href="#logout" class="logout-link">Logout</a>
    </div>
  </header>

  <main class="center">
    <section class="card">
      <h2>Welcome to PostIt</h2>
      <a href="#">Create an account</a>
      <p>or<br>Please log in</p>
      <form action="index.html#logged-in">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button class="primary" type="submit">Log in</button>
      </form>
      <a href="#">Forget password</a>
    </section>
  </main>

  <footer>PostIt</footer>
</body>
</html>
